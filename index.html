<!DOCTYPE html>
<html lang="en">
  <head>
    <title>VR Ghost House</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Basic Scene - A-Frame">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v4.1.2/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="fireplace" src="Models/Fireplace with scary decorations.glb"></a-asset-item>
        <a-asset-item id="pumpkin_1" scale="0.29165 0.29165 0.29165" position="4.26862 0.32756 -3.24166" rotation="0 -46.65308846852728 0" src="Models/Scary Pumpkins.glb"></a-asset-item>
        <a-asset-item id="pumpkin_2" rotation="0 40.34711497531744 0" position="3.0262 0.00029 -4.57546" src="Models\Pumpkin “with Easter Egg note” 😂🖕.glb"></a-asset-item>
        <a-asset-item id="clown" src="Models\Scary Halloween face .glb"></a-asset-item>
        <a-asset-item id="zombie_1" rotation="0 -50.43002625402967 0" scale="0.57839 0.57839 0.57839" position="1.94084 0.5709 -3.00608" src="Models\zombie 1.glb"></a-asset-item>
        <a-asset-item id="shed" src="shed/scene.gltf"></a-asset-item>
        <a-asset-item id="barn" src="barn/scene.gltf"></a-asset-item>
        <a-asset-item id="slide" src="test_models/abandoned_childrens_slide.glb"></a-asset-item>
        <a-asset-item id="car" src="test_models/car.glb"></a-asset-item>
      </a-assets>
      <a-entity environment="preset: forest"></a-entity>
      <a-entity gltf-model="#shed" scale="100 100 100" position="0 0 0"></a-entity>
      <a-entity gltf-model="#barn" position="20 0 10"></a-entity>
      <a-entity gltf-model="#slide" position="5 0 10"></a-entity>
      <a-entity gltf-model="#car" scale="0.005 0.005 0.005" position="10 0.1 15"></a-entity>
    </a-scene>
  </body>
</html>
