<!DOCTYPE html>

  <head>
    <title>VR Ghost House</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Basic Scene - A-Frame">

    <a-scene fog="type: exponential; color: #111; density: 0.25;">

        <a-asset-item id="shed" src="shed/scene.gltf"></a-asset-item>

        <a-asset-item id="chair" src="Models\chair\Old_Chair.glb"></a-asset-item>
        <!-- https://www.cgtrader.com/3d-model/barrel-v1-low-poly -->
        <a-asset-item id="barrels" src="Models\barrels.glb"></a-asset-item>
        <!-- https://poly.cam/capture/d0a303b8-4475-4195-b62a-c6305f44c0da -->

        <!-- https://poly.cam/capture/4658a691-4f40-4c01-a678-437c230f5241 -->
        <a-asset-item id="zombie1" src="Models\zombie 1.glb"></a-asset-item>
        <!-- https://www.cgtrader.com/free-3d-models/animals/insect/low-poly-skeletal-horror-spider -->
        <a-asset-item id="spider" src="Models\bigspider.glb"></a-asset-item>
      </a-assets>

      <a-entity camera look-controls auto-move-forward  position="0 1.2 0" ></a-entity>

      <a-entity environment="preset: forest; fog:.05; skyColor: #000000; horizonColor:#000; groundColor:#212006; groundColor2:#071703"></a-entity>

      <a-entity id="barn_id" rotation="0 -108.47122385857719 0" gltf-model="#barn" position="12.24464 0 6.3069"></a-entity>
